<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Frota Jornada — Encarregado</title>
<style>
  :root{
    --bg:#0f1620;
    --card:#16202c;
    --card2:#1c2836;
    --line:#2a3746;
    --text:#e8edf3;
    --muted:#b7c4d1;
    --amber:#f2a93b;
    --amber-d:#c8811d;
    --green:#3fbb78;
    --red:#e5615f;
    --blue:#4f9ce8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{padding-bottom:48px;}
  header{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#101822,#0f1620 90%);
    padding:14px 16px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  header h1{margin:0;font-size:16.5px;letter-spacing:.3px;font-weight:700;}
  header h1 span{color:var(--amber);}
  header .sub{margin-top:2px;font-size:12px;color:var(--muted);}
  .btn-header{
    flex-shrink:0;background:var(--card2);border:1px solid var(--line);color:var(--amber);
    font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px;}
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;
  }
  .card h2{
    margin:0 0 12px;font-size:13.5px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--amber);display:flex;align-items:center;gap:8px;
  }
  .card h2 .n{
    background:var(--amber);color:#1a1204;width:20px;height:20px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  }
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
  input,select,textarea{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .opgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
  .opbtn{
    padding:10px 4px;text-align:center;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .opbtn.active{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .opbtn.custom{border-style:dashed;color:var(--amber);}
  button.primary{
    width:100%;margin-top:14px;padding:13px;border:none;border-radius:12px;
    background:var(--amber);color:#1a1204;font-weight:800;font-size:15px;cursor:pointer;
  }
  button.primary:active{background:var(--amber-d);}
  button.primary:disabled{opacity:.55;cursor:not-allowed;}
  button.secondary{
    width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;
    background:transparent;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;
  }
  button.ghost{
    padding:8px 12px;border:1px dashed var(--line);border-radius:10px;
    background:transparent;color:var(--amber);font-weight:700;font-size:13px;cursor:pointer;
  }
  button.danger{
    width:100%;margin-top:8px;padding:11px;border:1px solid #5c2a2a;border-radius:12px;
    background:transparent;color:#ffb3b0;font-weight:600;font-size:14px;cursor:pointer;
  }
  .pill{
    display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  }
  .pill.andamento{background:#3a2f10;color:var(--amber);}
  .pill.rota{background:#132a3c;color:var(--blue);}
  .pill.retorno{background:#2b1f3a;color:#b18ef0;}
  .pill.concluido{background:#12301f;color:var(--green);}
  .pill.manual{background:#1a2a3a;color:#7eb8f0;}
  .summary-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0;}
  .summary-line b{color:var(--text);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#20304a;color:var(--text);padding:11px 18px;border-radius:10px;
    font-size:13.5px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.4);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;}
  .toast.err{background:#3a1a1a;color:#ffb3b0;border-color:#5c2a2a;}
  .lista-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .lista-item:last-child{border-bottom:none;}
  .lista-item:active{opacity:.75;}
  .lista-item .titulo{font-weight:700;font-size:14.5px;}
  .lista-item .meta{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .lista-item .direita{text-align:right;flex-shrink:0;}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type="date"]{flex:1;min-width:140px;}
  .toolbar button{flex:0 0 auto;width:auto;margin:0;padding:10px 14px;}
  .barra-acoes{display:flex;gap:8px;margin-top:12px;}
  .barra-acoes button{flex:1;margin-top:0;}
  .loja-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .loja-block:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .loja-title{font-weight:700;font-size:13.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .campo-hora{display:flex;gap:8px;align-items:stretch;margin-bottom:6px;}
  .campo-hora input[type="time"]{flex:1;}
  .campo-hora button{flex:0 0 auto;width:auto;min-width:88px;margin:0;padding:0 12px;font-size:13.5px;border-radius:10px;}
  .empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px;}
  .badge-ok{color:var(--green);font-size:12px;font-weight:700;}
  #modal-outro{
    display:none;position:fixed;inset:0;z-index:60;background:rgba(15,22,32,.88);
    align-items:center;justify-content:center;padding:16px;
  }
  #modal-outro .modal-card{
    width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  #modal-outro h3{margin:0 0 8px;color:var(--amber);font-size:17px;}
  #modal-outro p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45;}
  #outroDescricao{min-height:80px;resize:vertical;font-family:inherit;font-size:15px;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions button{flex:1;margin-top:0;}

  /* ── LOGIN ── */
  #login-screen{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #login-screen.hidden{display:none;}
  .login-card{
    width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:28px 24px;box-shadow:0 16px 48px rgba(0,0,0,.45);
  }
  .login-card .logo{
    text-align:center;margin-bottom:22px;
  }
  .login-card .logo h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;}
  .login-card .logo h1 span{color:var(--amber);}
  .login-card .logo p{margin:6px 0 0;font-size:13px;color:var(--muted);}
  .login-card label{margin-top:14px;}
  .login-error{
    display:none;margin-top:12px;padding:10px 12px;border-radius:10px;
    background:#3a1a1a;color:#ffb3b0;font-size:13px;border:1px solid #5c2a2a;text-align:center;
  }
  .login-error.show{display:block;}
  .login-hint{margin-top:16px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.4;}
  #app-area{display:none;}
  #app-area.visible{display:block;}
  .header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <h1>Frota <span>Jornada</span></h1>
      <p>Painel do Encarregado · Acesso restrito</p>
    </div>
    <label>Usuário (guerra)</label>
    <input type="text" id="login-user" placeholder="ex: joao.silva" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label>Senha</label>
    <input type="password" id="login-pass" placeholder="••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="primary" id="btn-login" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
    <p class="login-hint">Somente encarregados, supervisores e auxiliares.<br>Mesmo login do app Jornada.</p>
  </div>
</div>

<!-- APP (protegido) -->
<div id="app-area">
<header>
  <div>
    <h1>Frota <span>Jornada</span></h1>
    <div class="sub" id="statusLine">Lançamento pelo encarregado</div>
  </div>
  <div class="header-actions">
    <button class="btn-header" id="btnVoltarLista" style="display:none">← Lista</button>
    <button class="btn-header" id="btnLogout" title="Sair">Sair</button>
  </div>
</header>

<div class="wrap" id="app">
  <div class="empty">Carregando...</div>
</div>
</div><!-- /app-area -->

<div id="toast" class="toast"></div>

<div id="modal-outro">
  <div class="modal-card">
    <h3>Operação OUTRO</h3>
    <p>Descreva o serviço ou informe o nome da operação.</p>
    <textarea id="outroDescricao" placeholder="Ex: Manutenção, Treinamento, Transferência..."></textarea>
    <div class="modal-actions">
      <button class="secondary" id="btnCancelOutro">Cancelar</button>
      <button class="primary" id="btnOkOutro">Confirmar</button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbymMok1wWF8985aeyKS3nsjdiqIoLeMgEGIHF3GO2vvr_ErcDtYJmzM3gb9ju4YK9Ae/exec'
};

/* ── Acesso (mesma planilha RCM do app Jornada) ── */
const RCM_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQU606Dbi9ZWn1RSpKGn9Daey3XAsTWRDgstXI3ARb6Na2UF-nZ1hkfB7EVFwzfvQ/pub?gid=182320512&single=true&output=csv';
const SESSION_KEY = 'frota_enc_user';

/** Funções autorizadas a usar este painel */
const FUNCOES_PERMITIDAS = new Set(['ADMIN', 'ENCARREGADO', 'SUPERVISOR', 'AUXILIAR']);

let USERS = {
  "admin": { senha: "7391", nome: "Administrador", status: "ATIVO", funcao: "ADMIN" }
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

let currentUser = null;
let PLACAS = [];
let MOTORISTAS = [];
let LISTA = [];
let LANC = null;
let MODO = 'lista';
let DATA_FILTRO = '';
let OP_FILTRO = localStorage.getItem('frota_enc_op_filtro') || '';
let opSelecionada = '';

/* ======================= LOGIN / ACESSO ======================= */
function normalizeLogin(str) {
  return String(str || '').trim().toLowerCase()
    .replace(/\s+/g, '.')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9.]/g, '');
}

function parseRCMCsv(csvText) {
  const lines = csvText.split('\n');
  if (lines.length < 2) return null;

  const header = lines[0].split(',').map(h => h.trim().replace(/\r/g, ''));

  const idxNome   = header.findIndex(h => h.includes('FUNCION'));
  const idxGuerra = header.findIndex(h => h.includes('GUERRA'));
  const idxSenha  = header.findIndex(h => h.includes('SENHA'));
  const idxSit    = header.findIndex(h => h.includes('SITUA') || h.includes('SUTU'));
  const idxFuncao = header.findIndex(h => h.replace(/\s/g, '').toUpperCase().includes('FUN') && !h.includes('FUNCION'));

  if (idxNome < 0 || idxGuerra < 0 || idxSenha < 0 || idxSit < 0) return null;

  const newUsers = { "admin": { senha: "7391", nome: "Administrador", status: "ATIVO", funcao: "ADMIN" } };

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.trim().replace(/\r/g, ''));
    if (!cols[idxNome] || !cols[idxGuerra] || !cols[idxSenha]) continue;

    const nome     = cols[idxNome].trim();
    const guerra   = cols[idxGuerra].trim();
    const senha    = cols[idxSenha].trim();
    const situacao = (cols[idxSit] || '').trim().toUpperCase();
    const funcaoRaw = idxFuncao >= 0
      ? (cols[idxFuncao] || '').trim().toUpperCase()
      : (cols[10] || '').trim().toUpperCase();

    if (!nome || !guerra || !senha) continue;
    if (situacao === 'DEMITIDO') continue;

    const login = normalizeLogin(guerra);
    if (!login) continue;

    newUsers[login] = {
      senha,
      nome:    guerra.toUpperCase(),
      status:  situacao || 'ATIVO',
      funcao:  funcaoRaw || 'MOTORISTA'
    };
  }
  return newUsers;
}

async function syncUsersFromSheet() {
  try {
    const resp = await fetch(RCM_CSV_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const parsed = parseRCMCsv(text);
    if (parsed && Object.keys(parsed).length > 1) {
      USERS = parsed;
    }
  } catch (e) {
    console.warn('Sync RCM falhou, usando cache local se houver:', e.message);
  }
}

function podeAcessarPainel(user) {
  if (!user) return false;
  const f = String(user.funcao || '').toUpperCase().trim();
  return FUNCOES_PERMITIDAS.has(f);
}

function showLoginError(msg) {
  const el = $('#login-error');
  el.textContent = msg || 'Usuário ou senha incorretos.';
  el.classList.add('show');
}

function hideLoginError() {
  $('#login-error').classList.remove('show');
}

async function doLogin() {
  hideLoginError();
  const user = ($('#login-user').value || '').trim().toLowerCase();
  const pass = $('#login-pass').value;
  const btn = $('#btn-login');

  if (!user || !pass) {
    showLoginError('Informe usuário e senha.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verificando...';

  // tenta sincronizar antes do login (atualiza senhas/funções)
  await syncUsersFromSheet();

  const rec = USERS[user];
  if (!rec || String(rec.senha) !== String(pass)) {
    showLoginError('Usuário ou senha incorretos.');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  if ((rec.status || '').toUpperCase() === 'DEMITIDO') {
    showLoginError('Acesso revogado.');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  const candidate = {
    login: user,
    nome: rec.nome,
    status: rec.status,
    funcao: rec.funcao || 'MOTORISTA'
  };

  if (!podeAcessarPainel(candidate)) {
    showLoginError('Acesso restrito a encarregados, supervisores e auxiliares.');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  currentUser = candidate;
  localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
  btn.disabled = false;
  btn.textContent = 'Entrar';
  entrarNoApp();
}

function doLogout() {
  if (!confirm('Confirmar saída?')) return;
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  LANC = null;
  MODO = 'lista';
  $('#login-user').value = '';
  $('#login-pass').value = '';
  hideLoginError();
  $('#app-area').classList.remove('visible');
  $('#login-screen').classList.remove('hidden');
  $('#login-user').focus();
}

function entrarNoApp() {
  $('#login-screen').classList.add('hidden');
  $('#app-area').classList.add('visible');
  const nome = currentUser ? currentUser.nome : '';
  const func = currentUser ? currentUser.funcao : '';
  $('#statusLine').textContent = (nome ? nome + ' · ' : '') + 'Lançamento pelo encarregado' + (func ? ' (' + func + ')' : '');
  initApp();
}

async function tentarSessaoSalva() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved || !saved.login) return false;

    await syncUsersFromSheet();

    const rec = USERS[saved.login];
    if (!rec) {
      localStorage.removeItem(SESSION_KEY);
      return false;
    }
    // atualiza função/status e valida senha ainda bate (opcional — mantém sessão se usuário existe)
    saved.nome = rec.nome;
    saved.status = rec.status;
    saved.funcao = rec.funcao || saved.funcao;
    if (!podeAcessarPainel(saved) || (saved.status || '').toUpperCase() === 'DEMITIDO') {
      localStorage.removeItem(SESSION_KEY);
      return false;
    }
    currentUser = saved;
    localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
    return true;
  } catch (e) {
    return false;
  }
}

/* ======================= API ======================= */
async function apiGet(params){
  const url = CONFIG.API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, { cache: 'no-store' });
  return res.json();
}
async function apiPost(body){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
  return res.json();
}

function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=> t.className = 'toast', 2400);
}

function hojeISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function formatarDataBR(iso){
  if(!iso) return '—';
  const m = String(iso).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+'/'+m[2]+'/'+m[1];
  return iso;
}

function escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function statusPill(status){
  const map = {
    'Em andamento':['andamento','Em andamento'],
    'Em rota / lojas':['rota','Em rota / lojas'],
    'Retornando ao CD':['retorno','Retornando ao CD'],
    'Concluído':['concluido','Concluído']
  };
  const [cls,label] = map[status] || ['andamento', status || '—'];
  return `<span class="pill ${cls}">${label}</span>`;
}

/* ======================= INIT APP (após login) ======================= */
async function initApp(){
  DATA_FILTRO = hojeISO();
  try{
    PLACAS = await apiGet({action:'getPlacas'}) || [];
  }catch(e){ PLACAS = []; }
  try{
    MOTORISTAS = await apiGet({action:'getMotoristas'}) || [];
  }catch(e){ MOTORISTAS = []; }

  $('#btnVoltarLista').onclick = () => {
    LANC = null;
    MODO = 'lista';
    carregarLista();
  };
  $('#btnLogout').onclick = doLogout;

  await carregarLista();
}

function opPassaFiltro(op, filtro){
  if(!filtro) return true;
  const o = String(op || '').trim().toUpperCase();
  if(filtro === '__OUTRO__'){
    return o.startsWith('OUTRO') || (o && !['LS','TL','HT','CV'].includes(o));
  }
  return o === filtro || o.startsWith(filtro + ' ') || o.startsWith(filtro + '—') || o.startsWith(filtro + '-');
}

async function carregarLista(){
  MODO = 'lista';
  LANC = null;
  $('#btnVoltarLista').style.display = 'none';
  if (currentUser) {
    $('#statusLine').textContent = currentUser.nome + ' · Lançamento pelo encarregado (' + currentUser.funcao + ')';
  } else {
    $('#statusLine').textContent = 'Lançamento pelo encarregado';
  }

  const ops = [
    {v:'', t:'Todas as operações'},
    {v:'LS', t:'LS'},
    {v:'TL', t:'TL'},
    {v:'HT', t:'HT'},
    {v:'CV', t:'CV'},
    {v:'__OUTRO__', t:'OUTRO / demais'}
  ];
  const optsOp = ops.map(o =>
    `<option value="${o.v}" ${OP_FILTRO===o.v?'selected':''}>${o.t}</option>`
  ).join('');

  app.innerHTML = `
    <div class="toolbar">
      <input type="date" id="fDataFiltro" value="${DATA_FILTRO}">
      <select id="fOpFiltro" style="flex:1;min-width:140px">${optsOp}</select>
    </div>
    <div class="toolbar" style="margin-top:0">
      <button class="secondary" id="btnAtualizar" style="flex:1">Atualizar</button>
      <button class="primary" id="btnNovo" style="flex:1;margin:0;padding:11px">+ Novo</button>
    </div>
    <div class="card" id="listaCard">
      <div class="empty">Carregando lançamentos...</div>
    </div>
    <p class="hint" style="text-align:center;margin-top:8px">
      Toque em um lançamento para editar · ou crie um novo do zero<br>
      O filtro de operação fica salvo neste aparelho
    </p>
  `;

  $('#btnAtualizar').onclick = () => {
    DATA_FILTRO = $('#fDataFiltro').value || hojeISO();
    OP_FILTRO = $('#fOpFiltro').value || '';
    localStorage.setItem('frota_enc_op_filtro', OP_FILTRO);
    carregarLista();
  };
  $('#fDataFiltro').onchange = () => {
    DATA_FILTRO = $('#fDataFiltro').value || hojeISO();
  };
  $('#fOpFiltro').onchange = () => {
    OP_FILTRO = $('#fOpFiltro').value || '';
    localStorage.setItem('frota_enc_op_filtro', OP_FILTRO);
    renderLista();
  };
  $('#btnNovo').onclick = () => renderNovo();

  try{
    const lista = await apiGet({action:'getLancamentos', data: DATA_FILTRO});
    LISTA = Array.isArray(lista) ? lista : [];
    renderLista();
  }catch(e){
    $('#listaCard').innerHTML = '<div class="empty">Falha ao carregar. Verifique a conexão.</div>';
  }
}

function renderLista(){
  const card = $('#listaCard');
  const filtrada = LISTA.filter(l => opPassaFiltro(l.Operacao, OP_FILTRO));

  if(!LISTA.length){
    card.innerHTML = `
      <div class="empty">
        Nenhum lançamento em ${formatarDataBR(DATA_FILTRO)}.<br><br>
        <button class="primary" id="btnNovoEmpty" style="max-width:220px;margin:0 auto">Criar o primeiro</button>
      </div>`;
    $('#btnNovoEmpty') && ($('#btnNovoEmpty').onclick = () => renderNovo());
    return;
  }

  if(!filtrada.length){
    const labelOp = OP_FILTRO === '__OUTRO__' ? 'OUTRO / demais' : (OP_FILTRO || 'esta operação');
    card.innerHTML = `
      <div class="empty">
        Nenhum lançamento de <b style="color:var(--text)">${escHtml(labelOp)}</b><br>
        em ${formatarDataBR(DATA_FILTRO)}.<br><br>
        Troque o filtro ou crie um novo.
      </div>`;
    return;
  }

  const ordem = { 'Em andamento':0, 'Em rota / lojas':1, 'Retornando ao CD':2, 'Concluído':3 };
  filtrada.sort((a,b) => {
    const sa = ordem[a.Status] ?? 9;
    const sb = ordem[b.Status] ?? 9;
    if(sa !== sb) return sa - sb;
    return String(a.Placa||'').localeCompare(String(b.Placa||''));
  });

  const qtdTotal = LISTA.length;
  const qtdFiltro = filtrada.length;
  const avisoFiltro = OP_FILTRO
    ? `<div class="hint" style="margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)">
         Mostrando <b style="color:var(--text)">${qtdFiltro}</b> de ${qtdTotal} · filtro: <b style="color:var(--amber)">${escHtml(OP_FILTRO === '__OUTRO__' ? 'OUTRO' : OP_FILTRO)}</b>
       </div>`
    : '';

  card.innerHTML = avisoFiltro + filtrada.map(l => {
    const nLojas = (l.Paradas || []).length;
    return `
      <div class="lista-item" data-id="${escHtml(l.ID)}">
        <div>
          <div class="titulo">${escHtml(l.Placa || '—')} · ${escHtml(l.Motorista || '—')}</div>
          <div class="meta">${escHtml(l.Operacao || '—')} · ${escHtml(l.Destino || 'sem destino')} · ${nLojas} loja(s)</div>
        </div>
        <div class="direita">
          ${statusPill(l.Status)}
          <div class="meta" style="margin-top:4px">${l.HoraProgramadaSaida || '—'}</div>
        </div>
      </div>`;
  }).join('');

  $$('.lista-item').forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.id;
      try{
        toast('Carregando...');
        const l = await apiGet({action:'getLancamento', id});
        if(l && l.ID){
          LANC = l;
          renderEditar();
        }else{
          toast(l?.erro || 'Lançamento não encontrado', true);
        }
      }catch(e){
        toast('Falha de conexão', true);
      }
    };
  });
}

/* ======================= NOVO LANÇAMENTO ======================= */
function renderNovo(){
  MODO = 'novo';
  LANC = null;
  opSelecionada = (OP_FILTRO && ['LS','TL','HT','CV'].includes(OP_FILTRO)) ? OP_FILTRO : '';
  $('#btnVoltarLista').style.display = '';
  $('#statusLine').textContent = (currentUser ? currentUser.nome + ' · ' : '') + 'Novo lançamento';

  const optsMotorista = MOTORISTAS.length
    ? MOTORISTAS.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('')
    : '<option value="">— digite o nome —</option>';

  let optsPlaca = '<option value="">Selecione a placa</option>';
  if(PLACAS.length){
    const porOp = {};
    PLACAS.forEach(p => {
      const op = p.op || p.OP || 'Geral';
      if(!porOp[op]) porOp[op] = [];
      porOp[op].push(p);
    });
    Object.keys(porOp).sort().forEach(op => {
      optsPlaca += `<optgroup label="${escHtml(op)}">`;
      porOp[op].forEach(p => {
        const placa = p.placa || p.PLACA || p;
        const frota = p.frota || p.FT || '';
        optsPlaca += `<option value="${escHtml(placa)}">${escHtml(placa)}${frota ? ' — Frota '+frota : ''}</option>`;
      });
      optsPlaca += '</optgroup>';
    });
  }

  app.innerHTML = `
    <div class="card">
      <h2><span class="n">1</span> Início da jornada</h2>

      <label>Motorista</label>
      ${MOTORISTAS.length
        ? `<select id="fMotorista"><option value="">Selecione</option>${optsMotorista}</select>`
        : `<input id="fMotorista" placeholder="Nome do motorista" autocomplete="off">`}

      <label>Data da saída</label>
      <input type="date" id="fData" value="${DATA_FILTRO || hojeISO()}">

      <label>Hora programada de saída</label>
      <input type="time" id="fHoraProgSaida">

      <label>Operação</label>
      <div class="opgrid" id="opGrid">
        <div class="opbtn" data-op="LS">LS</div>
        <div class="opbtn" data-op="TL">TL</div>
        <div class="opbtn" data-op="HT">HT</div>
        <div class="opbtn" data-op="CV">CV</div>
        <div class="opbtn custom" data-op="OUTRO">OUTRO</div>
      </div>
      <div class="hint" id="opDetalhe"></div>

      <label>Placa</label>
      <select id="fPlaca">${optsPlaca}</select>

      <label>Destino</label>
      <input id="fDestino" placeholder="Ex: Lojas do centro, CD, GB..." autocomplete="off">

      <label>Km de saída</label>
      <input type="number" inputmode="numeric" id="fKmSaida" placeholder="Odômetro">

      <button class="primary" id="btnCriar">Criar lançamento</button>
      <button class="secondary" id="btnCancelNovo">Cancelar</button>
    </div>
  `;

  $$('#opGrid .opbtn').forEach(btn => {
    btn.onclick = () => {
      const op = btn.dataset.op;
      if(op === 'OUTRO'){
        $('#modal-outro').style.display = 'flex';
        $('#outroDescricao').value = '';
        $('#outroDescricao').focus();
        return;
      }
      opSelecionada = op;
      $$('#opGrid .opbtn').forEach(b => b.classList.toggle('active', b.dataset.op === op));
      $('#opDetalhe').textContent = '';
    };
  });
  if(opSelecionada){
    $$('#opGrid .opbtn').forEach(b => b.classList.toggle('active', b.dataset.op === opSelecionada));
  }

  $('#btnOkOutro').onclick = () => {
    const txt = ($('#outroDescricao').value || '').trim();
    if(!txt){ toast('Descreva a operação', true); return; }
    opSelecionada = 'OUTRO — ' + txt;
    $$('#opGrid .opbtn').forEach(b => b.classList.toggle('active', b.dataset.op === 'OUTRO'));
    $('#opDetalhe').textContent = opSelecionada;
    $('#modal-outro').style.display = 'none';
  };
  $('#btnCancelOutro').onclick = () => { $('#modal-outro').style.display = 'none'; };

  $('#btnCancelNovo').onclick = () => carregarLista();

  $('#btnCriar').onclick = async () => {
    const motorista = ($('#fMotorista').value || '').trim();
    const data = $('#fData').value;
    const hora = $('#fHoraProgSaida').value;
    const placa = $('#fPlaca').value;
    const destino = ($('#fDestino').value || '').trim();
    const km = ($('#fKmSaida').value || '').trim();

    if(!motorista || !data || !opSelecionada || !placa || !km){
      toast('Preencha motorista, data, operação, placa e km de saída', true);
      return;
    }

    const btn = $('#btnCriar');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try{
      const r = await apiPost({
        action: 'criarLancamento',
        Motorista: motorista,
        Data: data,
        HoraProgramadaSaida: hora,
        Operacao: opSelecionada,
        Placa: placa,
        Destino: destino,
        KmSaida: km
      });
      if(r.ok && r.id){
        toast('Lançamento criado!');
        const l = await apiGet({action:'getLancamento', id: r.id});
        if(l && l.ID){
          LANC = l;
          renderEditar();
        }else{
          carregarLista();
        }
      }else{
        toast(r.erro || 'Erro ao criar', true);
      }
    }catch(e){
      toast('Falha de conexão', true);
    }
    btn.disabled = false;
    btn.textContent = 'Criar lançamento';
  };
}

/* ======================= EDITAR LANÇAMENTO ======================= */
function renderEditar(){
  if(!LANC){ carregarLista(); return; }
  MODO = 'editar';
  $('#btnVoltarLista').style.display = '';
  $('#statusLine').innerHTML = `${escHtml(LANC.Motorista||'')} · ${escHtml(LANC.Placa||'')} · ${statusPill(LANC.Status)}`;

  const paradas = LANC.Paradas || [];
  const concluido = LANC.Status === 'Concluído';

  let html = `
    <div class="card">
      <h2><span class="n">✓</span> Resumo</h2>
      <div class="summary-line"><span>Motorista</span><b>${escHtml(LANC.Motorista||'—')}</b></div>
      <div class="summary-line"><span>Data</span><b>${formatarDataBR(LANC.Data)}</b></div>
      <div class="summary-line"><span>Operação</span><b>${escHtml(LANC.Operacao||'—')}</b></div>
      <div class="summary-line"><span>Placa</span><b>${escHtml(LANC.Placa||'—')}</b></div>
      <div class="summary-line"><span>Destino</span><b>${escHtml(LANC.Destino||'—')}</b></div>
      <div class="summary-line"><span>Km saída</span><b>${escHtml(LANC.KmSaida||'—')}</b></div>
      ${LANC.TotalKm ? `<div class="summary-line"><span>Total Km</span><b>${escHtml(LANC.TotalKm)}</b></div>` : ''}
      ${LANC.TotalHorasViagem ? `<div class="summary-line"><span>Horas viagem</span><b>${escHtml(LANC.TotalHorasViagem)}</b></div>` : ''}
      ${LANC.TotalHorasLojas ? `<div class="summary-line"><span>Horas nas lojas</span><b>${escHtml(LANC.TotalHorasLojas)}</b></div>` : ''}
    </div>
  `;

  html += `
    <div class="card">
      <h2><span class="n">1</span> Dados principais</h2>
      <label>Hora programada / saída do veículo</label>
      <input type="time" id="fHoraSaida" value="${escHtml(LANC.HoraProgramadaSaida||'')}">

      <label>Destino</label>
      <input id="fDestinoEdit" value="${escHtml(LANC.Destino||'')}" placeholder="Destino">

      <label>Motorista (corrigir se necessário)</label>
      ${MOTORISTAS.length
        ? `<select id="fMotoristaEdit"><option value="">—</option>${MOTORISTAS.map(n =>
            `<option value="${escHtml(n)}" ${n===LANC.Motorista?'selected':''}>${escHtml(n)}</option>`).join('')}</select>`
        : `<input id="fMotoristaEdit" value="${escHtml(LANC.Motorista||'')}">`}

      <button class="secondary" id="btnSalvarPrincipais">Salvar dados principais</button>
    </div>
  `;

  html += `
    <div class="card">
      <h2><span class="n">2</span> Lojas / Paradas</h2>
  `;

  if(!paradas.length){
    html += `<p class="hint" style="margin:0 0 10px">Nenhuma loja lançada ainda.</p>`;
  }

  paradas.forEach((p, i) => {
    const id = p.ID || p.id;
    html += `
      <div class="loja-block" data-parada-id="${escHtml(id)}">
        <div class="loja-title">
          <span>Loja ${p.NumeroLoja || (i+1)}</span>
          ${p.HoraSaida ? '<span class="badge-ok">✓ completa</span>' : ''}
        </div>
        <label>Chegada</label>
        <div class="campo-hora">
          <input type="time" id="p_${id}_chegada" value="${escHtml(p.HoraChegada||'')}">
          <button class="secondary btn-salva-parada" data-parada="${escHtml(id)}" data-campo="HoraChegada">Salvar</button>
        </div>
        <label>Abertura baú</label>
        <div class="campo-hora">
          <input type="time" id="p_${id}_abertura" value="${escHtml(p.HoraAberturaBau||'')}">
          <button class="secondary btn-salva-parada" data-parada="${escHtml(id)}" data-campo="HoraAberturaBau">Salvar</button>
        </div>
        <label>Fechamento baú</label>
        <div class="campo-hora">
          <input type="time" id="p_${id}_fechamento" value="${escHtml(p.HoraFechamentoBau||'')}">
          <button class="secondary btn-salva-parada" data-parada="${escHtml(id)}" data-campo="HoraFechamentoBau">Salvar</button>
        </div>
        <label>Saída da loja</label>
        <div class="campo-hora">
          <input type="time" id="p_${id}_saida" value="${escHtml(p.HoraSaida||'')}">
          <button class="secondary btn-salva-parada" data-parada="${escHtml(id)}" data-campo="HoraSaida">Salvar</button>
        </div>
      </div>
    `;
  });

  if(!concluido){
    html += `
      <button class="ghost" id="btnAddLoja" style="width:100%;margin-top:12px">+ Adicionar loja</button>
    `;
  }
  html += `</div>`;

  html += `
    <div class="card">
      <h2><span class="n">3</span> Retorno ao CD / Finalização</h2>
      <label>Hora de chegada no CD</label>
      <input type="time" id="fHoraCD" value="${escHtml(LANC.HoraChegadaCD||'')}">

      <label>Data de chegada (se virar o dia)</label>
      <input type="date" id="fDataChegada" value="${escHtml(LANC.DataChegada || LANC.Data || '')}">

      <label>Km de chegada</label>
      <input type="number" inputmode="numeric" id="fKmChegada" value="${escHtml(LANC.KmChegada||'')}">

      <button class="primary" id="btnSalvarRetorno">${concluido ? 'Atualizar finalização' : 'Salvar e finalizar'}</button>
      ${!concluido ? '<button class="secondary" id="btnSalvarRetornoParcial">Salvar sem finalizar</button>' : ''}
    </div>
  `;

  html += `
    <button class="secondary" id="btnVoltar">← Voltar à lista</button>
  `;

  app.innerHTML = html;

  $('#btnVoltar').onclick = () => carregarLista();

  $('#btnSalvarPrincipais').onclick = async () => {
    const campos = {
      HoraProgramadaSaida: $('#fHoraSaida').value,
      Destino: ($('#fDestinoEdit').value || '').trim()
    };
    const mot = ($('#fMotoristaEdit')?.value || '').trim();
    if(mot) campos.Motorista = mot;

    try{
      const r = await apiPost({action:'atualizarLancamento', id: LANC.ID, campos});
      if(r.ok){
        toast('Dados salvos');
        LANC = await apiGet({action:'getLancamento', id: LANC.ID});
        renderEditar();
      }else toast(r.erro || 'Erro ao salvar', true);
    }catch(e){ toast('Falha de conexão', true); }
  };

  $$('.btn-salva-parada').forEach(btn => {
    btn.onclick = async () => {
      const paradaId = btn.dataset.parada;
      const campo = btn.dataset.campo;
      const mapId = {
        HoraChegada: 'chegada',
        HoraAberturaBau: 'abertura',
        HoraFechamentoBau: 'fechamento',
        HoraSaida: 'saida'
      };
      const el = document.getElementById(`p_${paradaId}_${mapId[campo]}`);
      const valor = el ? el.value : '';
      if(!valor){ toast('Selecione o horário', true); return; }

      btn.disabled = true;
      try{
        const r = await apiPost({action:'atualizarParada', id: paradaId, campos: {[campo]: valor}});
        if(r.ok){
          toast('Horário salvo');
          LANC = await apiGet({action:'getLancamento', id: LANC.ID});
          renderEditar();
        }else toast(r.erro || 'Erro', true);
      }catch(e){ toast('Falha de conexão', true); }
      btn.disabled = false;
    };
  });

  if($('#btnAddLoja')){
    $('#btnAddLoja').onclick = async () => {
      const n = (LANC.Paradas || []).length + 1;
      try{
        const r = await apiPost({action:'criarParada', lancamentoId: LANC.ID, numeroLoja: n});
        if(r.ok){
          toast('Loja adicionada');
          LANC = await apiGet({action:'getLancamento', id: LANC.ID});
          renderEditar();
        }else toast(r.erro || 'Erro', true);
      }catch(e){ toast('Falha de conexão', true); }
    };
  }

  const salvarRetorno = async (finalizar) => {
    const campos = {
      HoraChegadaCD: $('#fHoraCD').value,
      DataChegada: $('#fDataChegada').value,
      KmChegada: ($('#fKmChegada').value || '').trim()
    };

    try{
      const r = await apiPost({action:'atualizarLancamento', id: LANC.ID, campos});
      if(r.ok){
        toast(finalizar ? 'Finalizado / atualizado' : 'Salvo');
        LANC = await apiGet({action:'getLancamento', id: LANC.ID});
        renderEditar();
      }else toast(r.erro || 'Erro ao salvar', true);
    }catch(e){ toast('Falha de conexão', true); }
  };

  $('#btnSalvarRetorno').onclick = () => salvarRetorno(true);
  if($('#btnSalvarRetornoParcial')){
    $('#btnSalvarRetornoParcial').onclick = () => salvarRetorno(false);
  }
}

/* ======================= START ======================= */
(async function boot(){
  // pré-carrega usuários da planilha enquanto mostra login
  syncUsersFromSheet();
  const ok = await tentarSessaoSalva();
  if (ok) {
    entrarNoApp();
  } else {
    $('#login-screen').classList.remove('hidden');
    $('#app-area').classList.remove('visible');
    setTimeout(() => $('#login-user').focus(), 100);
  }
})();
</script>
