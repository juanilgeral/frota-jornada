<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Frota Jornada — Motorista</title>
<style>
  :root{
    --bg:#0f1620;
    --card:#16202c;
    --card2:#1c2836;
    --line:#2a3746;
    --text:#e8edf3;
    --muted:#b7c4d1;
    --amber:#f2a93b;
    --amber-d:#c8811d;
    --green:#3fbb78;
    --red:#e5615f;
    --blue:#4f9ce8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{padding-bottom:40px;}
  header{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#101822,#0f1620 90%);
    padding:16px 18px 14px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  header h1{margin:0;font-size:17px;letter-spacing:.3px;font-weight:700;}
  header h1 span{color:var(--amber);}
  header .sub{margin-top:3px;font-size:12.5px;color:var(--muted);}
  .btn-jornada{
    flex-shrink:0;background:var(--card2);border:1px solid var(--line);color:var(--amber);
    font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .wrap{max-width:520px;margin:0 auto;padding:16px;}
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:14px;
  }
  .card h2{
    margin:0 0 14px;font-size:14px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--amber);display:flex;align-items:center;gap:8px;
  }
  .card h2 .n{
    background:var(--amber);color:#1a1204;width:20px;height:20px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  }
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;}
  input,select,textarea{
    width:100%;padding:12px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15.5px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  input::placeholder{color:#7c8b9c;opacity:1;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .opgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
  .opbtn{
    padding:10px 4px;text-align:center;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;
    line-height:1.25;word-break:break-word;
  }
  .opbtn.active{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .opbtn.custom{border-style:dashed;color:var(--amber);}
  .op-selected-detail{font-size:11.5px;color:var(--amber);margin-top:6px;min-height:15px;}
  #modal-outro{
    display:none;position:fixed;inset:0;z-index:60;background:rgba(15,22,32,.88);
    align-items:center;justify-content:center;padding:16px;
  }
  #modal-outro .modal-card{
    width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  #modal-outro h3{margin:0 0 8px;color:var(--amber);font-size:17px;}
  #modal-outro p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45;}
  #outroDescricao{min-height:92px;resize:vertical;font-family:inherit;font-size:15px;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions button{flex:1;margin-top:0;}
  .modal-error{color:#ffb3b0;font-size:12px;min-height:17px;margin-top:6px;}
  button.primary{
    width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:var(--amber);color:#1a1204;font-weight:800;font-size:15.5px;cursor:pointer;
  }
  button.primary:active{background:var(--amber-d);}
  button.secondary{
    width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;
    background:transparent;color:var(--text);font-weight:600;font-size:14.5px;cursor:pointer;
  }
  button.ghost{
    padding:9px 12px;border:1px dashed var(--line);border-radius:10px;
    background:transparent;color:var(--amber);font-weight:700;font-size:13px;cursor:pointer;
  }
  .pill{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
  }
  .pill.andamento{background:#3a2f10;color:var(--amber);}
  .pill.rota{background:#132a3c;color:var(--blue);}
  .pill.retorno{background:#2b1f3a;color:#b18ef0;}
  .pill.concluido{background:#12301f;color:var(--green);}
  .total{
    margin-top:10px;padding:10px 12px;background:var(--card2);border-radius:10px;
    font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;
  }
  .total b{color:var(--text);font-size:14.5px;}
  .loja-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .loja-block:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .loja-title{font-weight:700;font-size:13.5px;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .badge-ok{color:var(--green);font-size:12px;font-weight:700;}
  .savebar{display:flex;gap:8px;margin-top:8px;}
  .savebar button{flex:1;}
  .hidden{display:none !important;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#20304a;color:var(--text);padding:11px 18px;border-radius:10px;
    font-size:13.5px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.4);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;}
  .toast.err{background:#3a1a1a;color:#ffb3b0;border-color:#5c2a2a;}
  .summary-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;}
  .summary-line b{color:var(--text);}
  .placa-hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .link-reset{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Frota <span>Jornada</span></h1>
    <div class="sub" id="statusLine">Preencha os dados de início do dia</div>
  </div>
  <button class="btn-jornada" onclick="window.open('https://juanilgeral.github.io/jornada/', '_blank')">📋 Ponto</button>
</header>

<div class="wrap" id="app"></div>

<div class="toast" id="toast"></div>

<div id="modal-outro" role="dialog" aria-modal="true" aria-labelledby="modal-outro-title">
  <div class="modal-card">
    <h3 id="modal-outro-title">Outra operação ou serviço</h3>
    <p>Informe o nome da operação ou descreva o serviço que será realizado.</p>
    <label for="outroDescricao">Operação ou serviço</label>
    <textarea id="outroDescricao" maxlength="80" placeholder="Ex.: Apoio operacional — entrega emergencial"></textarea>
    <div class="modal-error" id="outroErro" aria-live="polite"></div>
    <div class="modal-actions">
      <button class="secondary" id="btnCancelarOutro" type="button">Cancelar</button>
      <button class="primary" id="btnConfirmarOutro" type="button">Usar esta descrição</button>
    </div>
  </div>
</div>

<script>
/* ======================= CONFIG ======================= */
const CONFIG = {
  // Cole aqui a URL do App da Web publicado no Apps Script (Code.gs)
  API_URL: 'https://script.google.com/macros/s/AKfycbymMok1wWF8985aeyKS3nsjdiqIoLeMgEGIHF3GO2vvr_ErcDtYJmzM3gb9ju4YK9Ae/exec'
};

/* ======================= ESTADO ======================= */
let PLACAS = [];
let MOTORISTAS = [];
let LANC = null; // lançamento atual (objeto completo, vindo do backend)

const $ = (sel) => document.querySelector(sel);
const app = $('#app');

/* ======================= API ======================= */
async function apiGet(params){
  const url = CONFIG.API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS no Apps Script
    body: JSON.stringify(body)
  });
  return res.json();
}
function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=> t.className = 'toast', 2200);
}

/* ======================= INIT ======================= */
const HORAS_LIMITE_SEM_ATUALIZACAO = 30; // depois disso sem nenhum lançamento novo, trava por segurança

function horasDesdeUltimaAtualizacao(ultimaAtualizacao){
  if(!ultimaAtualizacao) return 0;
  // formato salvo pelo backend: dd/MM/yyyy HH:mm:ss
  const m = String(ultimaAtualizacao).match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return 0;
  const [, dd, mm, yyyy, hh, mi, ss] = m;
  const data = new Date(+yyyy, +mm - 1, +dd, +hh, +mi, +ss);
  return (Date.now() - data.getTime()) / 3600000;
}

function hojeISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatarDataBR(iso){
  if(!iso) return '—';
  const p = String(iso).split('-');
  if(p.length !== 3) return iso;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function agoraHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

async function init(){
  if(CONFIG.API_URL.includes('COLE_AQUI')){
    app.innerHTML = '<div class="card"><h2>Configuração pendente</h2>'+
      '<p style="color:var(--muted);font-size:13.5px">Defina CONFIG.API_URL no topo do arquivo index.html com a URL do App da Web do Apps Script.</p></div>';
    return;
  }
  try{
    PLACAS = await apiGet({action:'getPlacas'});
  }catch(e){ PLACAS = []; }
  try{
    MOTORISTAS = await apiGet({action:'getMotoristas'});
  }catch(e){ MOTORISTAS = []; }

  const savedId = localStorage.getItem('frota_jornada_id');
  if(savedId){
    try{
      const l = await apiGet({action:'getLancamento', id: savedId});
      if(l && l.ID){
        LANC = l;
        renderAndamento();
        return;
      }else if(l && l.erro){
        // resposta válida do servidor confirmando que esse lançamento não existe mais
        localStorage.removeItem('frota_jornada_id');
      }else{
        // resposta inesperada — trata como falha de conexão, NÃO deixa cair pra tela de início
        renderFalhaCarregamento(savedId);
        return;
      }
    }catch(e){
      // falha de rede/servidor — idem, não deixa criar lançamento novo por engano
      renderFalhaCarregamento(savedId);
      return;
    }
  }
  renderInicio();
}

function renderFalhaCarregamento(savedId){
  $('#statusLine').textContent = 'Não consegui carregar seu lançamento em aberto';
  app.innerHTML = `
    <div class="card" style="border-color:var(--red)">
      <h2 style="color:var(--red)">⚠ Falha ao carregar</h2>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 6px">
        Você tem um lançamento em aberto salvo neste aparelho, mas não consegui
        buscar os dados dele agora (sem internet ou o servidor demorou a responder).
      </p>
      <p style="color:var(--muted);font-size:13.5px">
        Tenta de novo antes de iniciar qualquer coisa — pra não duplicar o
        lançamento nem perder a data certa da viagem.
      </p>
    </div>
    <button class="primary" id="btnTentarDeNovo">Tentar carregar de novo</button>
  `;
  $('#btnTentarDeNovo').onclick = () => init();
}

/* ======================= TELA 1: INÍCIO DO DIA ======================= */
function renderInicio(){
  $('#statusLine').textContent = 'Preencha os dados de início do dia';
  const ops = ['LS','TL','HT','CV','OUTRO'];
  app.innerHTML = `
    <div class="card">
      <h2><span class="n">1</span> Início da jornada</h2>
      <label>Nome de guerra do motorista</label>
      <select id="fMotorista"></select>
      <div class="placa-hint" id="motoristaHint">Carregando lista de motoristas ativos...</div>

      <label>Data (saída — sempre hoje)</label>
      <div class="total" style="margin:0"><span>Data da jornada</span><b>${formatarDataBR(hojeISO())}</b></div>

      <label>Hora de saída do veículo:</label>
      <input type="time" id="fHoraProgSaida">

      <label>Operação</label>
      <div class="opgrid" id="opGrid">
        ${ops.map(o=>`<div class="opbtn${o === 'OUTRO' ? ' custom' : ''}" data-op="${o}">${o}</div>`).join('')}
      </div>
      <div class="op-selected-detail" id="opSelecionadaDetalhe" aria-live="polite"></div>

      <label>Placa do veículo</label>
      <select id="fPlaca"><option value="">Selecione a placa</option></select>
      <div class="placa-hint">Formato Mercosul ou nacional — lista vem do cadastro de frota.</div>

      <label>Destino e Nº da Loja:</label>
      <input type="text" id="fDestino" placeholder="Ex.: Zona Oeste — Loja 042">

      <label>Km de saída</label>
      <input type="number" inputmode="numeric" id="fKmSaida" placeholder="Ex.: 154320">

      <button class="primary" id="btnIniciar">Iniciar jornada</button>
    </div>
  `;

  let opSelecionada = '';
  const opSelecionadaDetalhe = $('#opSelecionadaDetalhe');
  const modalOutro = $('#modal-outro');
  const outroDescricao = $('#outroDescricao');
  const outroErro = $('#outroErro');

  function fecharModalOutro(){
    modalOutro.style.display = 'none';
    outroErro.textContent = '';
  }

  function selecionarOperacao(valor){
    const operacaoBase = valor.startsWith('OUTRO — ') ? 'OUTRO' : valor;
    document.querySelectorAll('.opbtn').forEach(b=>b.classList.toggle('active', b.dataset.op === operacaoBase));
    opSelecionada = valor;
    opSelecionadaDetalhe.textContent = operacaoBase === 'OUTRO'
      ? `Descrição: ${valor.startsWith('OUTRO — ') ? valor.substring(8) : 'pendente'}`
      : '';
  }

  document.querySelectorAll('.opbtn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.op === 'OUTRO'){
        outroDescricao.value = opSelecionada.startsWith('OUTRO — ') ? opSelecionada.substring(8) : '';
        outroErro.textContent = '';
        modalOutro.style.display = 'flex';
        setTimeout(()=>outroDescricao.focus(), 0);
        return;
      }
      selecionarOperacao(btn.dataset.op);
    };
  });

  $('#btnCancelarOutro').onclick = fecharModalOutro;
  $('#btnConfirmarOutro').onclick = ()=>{
    const descricao = outroDescricao.value.trim();
    if(!descricao){
      outroErro.textContent = 'Informe a operação ou o serviço para continuar.';
      outroDescricao.focus();
      return;
    }
    selecionarOperacao(`OUTRO — ${descricao}`);
    fecharModalOutro();
  };
  modalOutro.onclick = (event)=>{ if(event.target === modalOutro) fecharModalOutro(); };
  outroDescricao.onkeydown = (event)=>{
    if(event.key === 'Escape') fecharModalOutro();
    if((event.ctrlKey || event.metaKey) && event.key === 'Enter') $('#btnConfirmarOutro').click();
  };

  // Operação (do dia) e Placa (do veículo) são independentes uma da outra —
  // a lista de placas mostra todo o cadastro, agrupada por OP só pra facilitar achar.
  preencherPlacas();
  function preencherPlacas(){
    const sel = $('#fPlaca');
    if(PLACAS.length === 0){
      sel.innerHTML = '<option value="">Nenhuma placa cadastrada</option>';
      return;
    }
    const porOp = {};
    PLACAS.forEach(p => {
      const chave = p.op.toUpperCase() || 'OUTROS';
      (porOp[chave] = porOp[chave] || []).push(p);
    });
    let html = '<option value="">Selecione a placa</option>';
    Object.keys(porOp).sort().forEach(op => {
      html += `<optgroup label="${op}">` +
        porOp[op].map(p => `<option value="${p.placa}">${p.placa}${p.frota ? ' — Frota '+p.frota : ''}</option>`).join('') +
        `</optgroup>`;
    });
    sel.innerHTML = html;
  }

  // Lista de motoristas ativos, vinda da planilha de RH — evita erro de
  // digitação/apelido que quebrava o casamento de nomes no painel.
  preencherMotoristas();
  function preencherMotoristas(){
    const sel = $('#fMotorista');
    const hint = $('#motoristaHint');
    if(MOTORISTAS.length === 0){
      sel.innerHTML = '<option value="">Nenhum motorista ativo encontrado</option>';
      if(hint) hint.textContent = 'Não consegui carregar a lista — avise a supervisão.';
      return;
    }
    const salvo = localStorage.getItem('frota_jornada_nome') || '';
    sel.innerHTML = '<option value="">Selecione seu nome</option>' +
      MOTORISTAS.map(nome => `<option value="${nome}"${nome === salvo ? ' selected' : ''}>${nome}</option>`).join('');
    if(hint) hint.textContent = 'Lista vem do cadastro de motoristas ativos.';
  }

  $('#btnIniciar').onclick = async () => {
    const dados = {
      Motorista: $('#fMotorista').value.trim(),
      Data: hojeISO(), // saída é sempre no dia em que o lançamento é criado
      HoraProgramadaSaida: $('#fHoraProgSaida').value,
      Operacao: opSelecionada,
      Placa: $('#fPlaca').value,
      Destino: $('#fDestino').value,
      KmSaida: $('#fKmSaida').value
    };
    if(!dados.Motorista || !dados.Data || !dados.Operacao || !dados.Placa || !dados.KmSaida){
      toast('Preencha nome do motorista, data, operação, placa e km de saída.', true);
      return;
    }
    $('#btnIniciar').disabled = true;
    $('#btnIniciar').textContent = 'Salvando...';
    try{
      const r = await apiPost({action:'criarLancamento', ...dados});
      if(r.ok){
        localStorage.setItem('frota_jornada_id', r.id);
        localStorage.setItem('frota_jornada_nome', dados.Motorista);
        LANC = await apiGet({action:'getLancamento', id: r.id});
        toast('Jornada iniciada!');
        renderAndamento();
      }else{
        toast(r.erro || 'Erro ao salvar', true);
      }
    }catch(e){
      toast('Falha de conexão', true);
    }
    $('#btnIniciar').disabled = false;
    $('#btnIniciar').textContent = 'Iniciar jornada';
  };
}

/* ======================= TELA 2: EM ANDAMENTO ======================= */
function statusPill(status){
  const map = {
    'Em andamento':['andamento','Em andamento'],
    'Em rota / lojas':['rota','Em rota / lojas'],
    'Retornando ao CD':['retorno','Retornando ao CD'],
    'Concluído':['concluido','Concluído']
  };
  const [cls,label] = map[status] || ['andamento', status || '—'];
  return `<span class="pill ${cls}">${label}</span>`;
}

function renderConcluido(){
  $('#statusLine').innerHTML = `${LANC.Motorista ? LANC.Motorista + ' · ' : ''}${LANC.Operacao} · ${LANC.Placa} · ${statusPill('Concluído')}`;

  const paradas = LANC.Paradas || [];
  app.innerHTML = `
    <div class="card" style="border-color:var(--green)">
      <h2 style="color:var(--green)">✓ Viagem concluída</h2>
      <p style="color:var(--muted);font-size:13.5px;margin:0">
        Esse lançamento já foi fechado e não pode mais ser editado por aqui.
        Se precisar rodar de novo com o mesmo caminhão (2ª viagem, por exemplo),
        inicie um lançamento novo abaixo — ele entra como uma linha independente
        na planilha, sem mexer no que já foi registrado.
      </p>
    </div>

    <div class="card">
      <h2><span class="n">✓</span> Resumo (somente leitura)</h2>
      <div class="summary-line"><span>Motorista</span><b>${LANC.Motorista || '—'}</b></div>
      <div class="summary-line"><span>Data</span><b>${formatarDataBR(LANC.Data)}</b></div>
      <div class="summary-line"><span>Destino</span><b>${LANC.Destino || '—'}</b></div>
      <div class="summary-line"><span>Km saída → chegada</span><b>${LANC.KmSaida||'—'} → ${LANC.KmChegada||'—'}</b></div>
      ${LANC.TotalKm ? `<div class="summary-line"><span>Total Km</span><b>${LANC.TotalKm}</b></div>` : ''}
      ${LANC.TotalHorasViagem ? `<div class="summary-line"><span>Total horas da viagem</span><b>${LANC.TotalHorasViagem}</b></div>` : ''}
      ${LANC.TotalHorasLojas ? `<div class="summary-line"><span>Total horas nas lojas</span><b>${LANC.TotalHorasLojas}</b></div>` : ''}
      ${paradas.map((p, i) => `<div class="summary-line"><span>Loja ${i+1}</span><b>${p.HoraChegada||'—'} → ${p.HoraSaida||'—'}</b></div>`).join('')}
    </div>

    <button class="primary" id="btnNovaViagem">Iniciar nova viagem</button>
  `;

  $('#btnNovaViagem').onclick = () => {
    localStorage.removeItem('frota_jornada_id');
    LANC = null;
    renderInicio();
  };
}

function renderBloqueado(){
  $('#statusLine').innerHTML = `${LANC.Motorista ? LANC.Motorista + ' · ' : ''}${LANC.Operacao} · ${LANC.Placa} · <span class="pill" style="background:#3a1a1a;color:#ffb3b0">Bloqueado</span>`;

  const paradas = LANC.Paradas || [];
  app.innerHTML = `
    <div class="card" style="border-color:var(--red)">
      <h2 style="color:var(--red)">⚠ Lançamento sem movimento há muito tempo</h2>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 6px">
        Este lançamento (iniciado em <b style="color:var(--text)">${formatarDataBR(LANC.Data)}</b>) está há mais de
        ${HORAS_LIMITE_SEM_ATUALIZACAO}h sem nenhuma atualização. Por segurança, não é mais possível
        editar por aqui.
      </p>
      <p style="color:var(--muted);font-size:13.5px">
        Fale com o encarregado ou supervisão pra corrigir/fechar esse lançamento na planilha,
        e inicie um novo abaixo para o dia de hoje.
      </p>
    </div>

    <div class="card">
      <h2><span class="n">✓</span> Dados registrados (somente leitura)</h2>
      <div class="summary-line"><span>Motorista</span><b>${LANC.Motorista || '—'}</b></div>
      <div class="summary-line"><span>Destino</span><b>${LANC.Destino || '—'}</b></div>
      <div class="summary-line"><span>Km saída</span><b>${LANC.KmSaida || '—'}</b></div>
      <div class="summary-line"><span>Chegada CD</span><b>${LANC.HoraChegadaCD || '—'}</b></div>
      ${paradas.map((p, i) => `<div class="summary-line"><span>Loja ${i+1}</span><b>${p.HoraChegada||'—'} → ${p.HoraSaida||'—'}</b></div>`).join('')}
    </div>

    <button class="primary" id="btnNovoBloqueado">Iniciar novo lançamento (hoje)</button>
  `;

  $('#btnNovoBloqueado').onclick = () => {
    localStorage.removeItem('frota_jornada_id');
    LANC = null;
    renderInicio();
  };
}

function renderAndamento(){
  if(LANC.Status === 'Concluído'){
    renderConcluido();
    return;
  }
  const bloqueado = horasDesdeUltimaAtualizacao(LANC.UltimaAtualizacao) > HORAS_LIMITE_SEM_ATUALIZACAO;
  if(bloqueado){
    renderBloqueado();
    return;
  }

  $('#statusLine').innerHTML = `${LANC.Motorista ? LANC.Motorista + ' · ' : ''}${LANC.Operacao} · ${LANC.Placa} · ${statusPill(LANC.Status)}`;

  let html = `
    <div class="card">
      <h2><span class="n">✓</span> Resumo da jornada</h2>
      <div class="summary-line"><span>Motorista</span><b id="labelMotoristaAtual">${LANC.Motorista || '—'}</b> <span class="link-reset" style="display:inline;margin:0;font-size:11.5px" id="btnCorrigirNome">✏️ corrigir</span></div>
      <div id="blocoCorrigirNome" class="hidden" style="margin:8px 0">
        <select id="fMotoristaCorrigido">${MOTORISTAS.map(nome => `<option value="${nome}"${nome === LANC.Motorista ? ' selected' : ''}>${nome}</option>`).join('')}</select>
        <button class="secondary" id="btnSalvarNomeCorrigido" style="margin-top:6px">Salvar nome</button>
      </div>
      <div class="summary-line"><span>Data</span><b>${formatarDataBR(LANC.Data)}</b></div>
      <div class="summary-line"><span>Destino</span><b>${LANC.Destino || '—'}</b></div>
      <div class="summary-line"><span>Km saída</span><b>${LANC.KmSaida || '—'}</b></div>
      ${LANC.TotalKm ? `<div class="summary-line"><span>Total Km</span><b>${LANC.TotalKm}</b></div>` : ''}
      ${LANC.TotalHorasViagem ? `<div class="summary-line"><span>Total horas da viagem</span><b>${LANC.TotalHorasViagem}</b></div>` : ''}
      ${LANC.TotalHorasLojas ? `<div class="summary-line"><span>Total horas nas lojas</span><b>${LANC.TotalHorasLojas}</b></div>` : ''}
      <label style="margin-top:14px">Hora de saída do veículo${!LANC.HoraProgramadaSaida ? ' <span style="color:var(--red)">(faltando)</span>' : ''}</label>
      <input type="time" id="fHoraSaidaVeiculo" value="${LANC.HoraProgramadaSaida || ''}">
      <div class="placa-hint" id="status_horasaida">${LANC.HoraProgramadaSaida ? 'Salvo ✓' : 'Esqueceu de lançar — preencha aqui, salva sozinho ao sair do campo.'}</div>
    </div>
  `;

  // Bloco das lojas — libera um campo por vez, na sequência, e só pergunta
  // se tem próxima loja depois que a atual estiver 100% preenchida.
  // Usa a posição na lista (idx+1) como número confiável da loja, em vez de
  // confiar cegamente no campo NumeroLoja vindo da planilha.
  const paradas = LANC.Paradas || [];
  const numeroLojaAtual = paradas.length > 0 ? paradas.length : 1;
  const tituloLoja = `${numeroLojaAtual}ª Loja de entrega`;
  html += `<div class="card"><h2><span class="n">✓</span> ${tituloLoja}</h2>`;
  let mostrarPrompt = false;
  let numeroParaPrompt = 0;
  paradas.forEach((p, idx) => {
    const numeroReal = idx + 1;
    const ehUltima = idx === paradas.length - 1;
    const completa = !proximoCampoLoja(p);
    if(!ehUltima || completa){
      html += renderLojaCompleta(p, numeroReal);
    }else{
      html += renderLojaAtiva(p, numeroReal);
    }
    if(ehUltima && completa){
      const jaRespondeu = localStorage.getItem(`frota_loja_fim_${LANC.ID}`);
      if(!jaRespondeu){
        mostrarPrompt = true;
        numeroParaPrompt = numeroReal;
      }
    }
  });
  if(mostrarPrompt){
    html += `
      <div class="loja-block" style="text-align:center">
        <p style="margin:0 0 10px;font-size:14px">Tem uma ${numeroParaPrompt + 1}ª loja?</p>
        <div style="display:flex;gap:10px">
          <button class="secondary" id="btnLojaSim" style="flex:1">Sim</button>
          <button class="secondary" id="btnLojaNao" style="flex:1">Não</button>
        </div>
      </div>
    `;
  }
  html += `</div>`;

  // só libera depois que o motorista responder "Não" pra próxima loja —
  // enquanto isso (preenchendo a atual ou decidindo se abre outra), fica travado
  const retornoLiberado = !!localStorage.getItem('frota_loja_fim_' + LANC.ID);
  if(retornoLiberado){
    html += `
      <div class="card">
        <h2><span class="n">3</span> Retorno ao CD</h2>
        <label>Hora de chegada do veículo no CD</label>
        <input type="time" id="fHoraCD" value="${LANC.HoraChegadaCD || ''}">
        <div class="row2">
          <div><label>Data chegada do motorista</label><input type="date" id="fDataChegada" value="${LANC.DataChegadaMotorista || hojeISO()}"></div>
          <div><label>Km de chegada</label><input type="number" inputmode="numeric" id="fKmChegada" value="${LANC.KmChegada || ''}"></div>
        </div>
        <button class="primary" id="btnFinalizar">Salvar chegada / finalizar</button>
        <div class="placa-hint" id="status_retorno">Cada campo salva sozinho ao sair dele.</div>
      </div>
    `;
  }else{
    html += `
      <div class="card" style="opacity:.55">
        <h2><span class="n">3</span> Retorno ao CD</h2>
        <p class="placa-hint" style="margin:0">Termine de preencher as lojas e responda "Não" à pergunta de próxima loja pra liberar essa etapa.</p>
      </div>
    `;
  }

  html += `<div class="link-reset" id="btnNovo">Encerrar e iniciar novo lançamento</div>`;

  app.innerHTML = html;

  // Inputs de horário da loja: change + blur (em vários celulares o change
  // não dispara ao fechar o seletor de hora).
  document.querySelectorAll('input[data-parada][data-campo]').forEach(el=>{
    const salvar = () => salvarCampoSequencial(el.dataset.parada, el.dataset.campo);
    el.addEventListener('change', salvar);
    el.addEventListener('blur', salvar);
  });
  // Botão Salvar explícito — caminho confiável no celular
  document.querySelectorAll('button[data-parada][data-campo]').forEach(btn=>{
    btn.addEventListener('click', () => salvarCampoSequencial(btn.dataset.parada, btn.dataset.campo));
  });
  if($('#btnLojaSim')) $('#btnLojaSim').onclick = criarProximaLoja;
  if($('#btnLojaNao')) $('#btnLojaNao').onclick = naoTemProximaLoja;
  ligarAutoSaveRetorno();
  ligarAutoSaveHoraSaida();
  if($('#btnFinalizar')) $('#btnFinalizar').onclick = finalizarJornada;
  if($('#btnCorrigirNome')) $('#btnCorrigirNome').onclick = () => $('#blocoCorrigirNome').classList.remove('hidden');
  if($('#btnSalvarNomeCorrigido')) $('#btnSalvarNomeCorrigido').onclick = salvarNomeCorrigido;
  $('#btnNovo').onclick = () => {
    if(confirm('Isso vai limpar o lançamento atual deste aparelho (os dados continuam salvos na planilha). Confirmar?')){
      localStorage.removeItem('frota_jornada_id');
      LANC = null;
      renderInicio();
    }
  };
}

const CAMPOS_LOJA_ORDEM = [
  ['HoraChegada', 'chegada', 'Chegada'],
  ['HoraAberturaBau', 'abertura', 'Abertura do baú'],
  ['HoraFechamentoBau', 'fechamento', 'Fechamento do baú'],
  ['HoraSaida', 'saida', 'Saída']
];

function proximoCampoLoja(p){
  return CAMPOS_LOJA_ORDEM.find(([campo]) => !p[campo]);
}

function renderLojaCompleta(p, numero){
  return `
    <div class="loja-block">
      <div class="loja-title">
        <span>Loja ${numero} ✓</span>
        <span class="badge-ok">${p.TotalLoja ? 'Total: '+p.TotalLoja : ''}</span>
      </div>
      <div class="row2">
        <div class="summary-line"><span>Chegada</span><b>${p.HoraChegada||'—'}</b></div>
        <div class="summary-line"><span>Abertura baú</span><b>${p.HoraAberturaBau||'—'}</b></div>
      </div>
      <div class="row2">
        <div class="summary-line"><span>Fechamento baú</span><b>${p.HoraFechamentoBau||'—'}</b></div>
        <div class="summary-line"><span>Saída</span><b>${p.HoraSaida||'—'}</b></div>
      </div>
    </div>
  `;
}

function renderLojaAtiva(p, numero){
  const proximo = proximoCampoLoja(p);
  let html = `<div class="loja-block"><div class="loja-title"><span>Loja ${numero}</span></div>`;
  CAMPOS_LOJA_ORDEM.forEach(([campo, idSuf, label]) => {
    if(p[campo]){
      html += `<div class="summary-line"><span>${label}</span><b>${p[campo]}</b></div>`;
    }
  });
  if(proximo){
    const [campo, idSuf, label] = proximo;
    // Botão "Salvar" explícito: no celular o evento change do input type=time
    // frequentemente NÃO dispara ao fechar o seletor de hora, e o app ficava
    // travado no mesmo campo (ex.: Chegada) sem liberar Abertura/Fechamento/Saída.
    html += `<label>${label}</label>`;
    html += `<div style="display:flex;gap:8px;align-items:center">`;
    html += `<input type="time" id="p_${p.ID}_${idSuf}" data-parada="${p.ID}" data-campo="${campo}" style="flex:1">`;
    html += `<button type="button" class="secondary" id="btnSalvarCampo_${p.ID}" data-parada="${p.ID}" data-campo="${campo}" style="flex:0 0 auto;padding:10px 14px;white-space:nowrap">Salvar</button>`;
    html += `</div>`;
    html += `<div class="placa-hint" id="status_${p.ID}">Escolha o horário e toque em Salvar — o próximo campo libera sozinho.</div>`;
  }
  html += `</div>`;
  return html;
}

// Evita double-tap / change+blur disparando dois saves ao mesmo tempo
let _salvandoCampo = false;

// Salva UM campo por vez e recarrega a tela pra liberar o próximo da sequência
// (chegada → abertura → fechamento → saída).
async function salvarCampoSequencial(paradaId, campo){
  if(_salvandoCampo) return;
  const idSuf = { HoraChegada:'chegada', HoraAberturaBau:'abertura', HoraFechamentoBau:'fechamento', HoraSaida:'saida' }[campo];
  const el = document.getElementById(`p_${paradaId}_${idSuf}`);
  const valor = el ? el.value : '';
  if(!valor){
    toast('Selecione o horário antes de salvar', true);
    return;
  }
  _salvandoCampo = true;
  const status = document.getElementById(`status_${paradaId}`);
  const btn = document.getElementById(`btnSalvarCampo_${paradaId}`);
  if(status) status.textContent = 'Salvando...';
  if(btn){ btn.disabled = true; btn.textContent = '...'; }
  try{
    const r = await apiPost({action:'atualizarParada', id: paradaId, campos: {[campo]: valor}});
    if(r.ok){
      LANC = await apiGet({action:'getLancamento', id: LANC.ID});
      _salvandoCampo = false;
      renderAndamento();
      return;
    }else{
      if(status) status.textContent = 'Erro ao salvar! Tente de novo.';
      toast(r.erro || 'Erro ao salvar', true);
    }
  }catch(e){
    if(status) status.textContent = 'Falha de conexão — tente de novo';
    toast('Falha de conexão', true);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Salvar'; }
  _salvandoCampo = false;
}

async function criarProximaLoja(){
  const btn = $('#btnLojaSim');
  if(btn){ btn.disabled = true; btn.textContent = 'Abrindo...'; }
  try{
    const paradas = LANC.Paradas || [];
    const proximoNumero = paradas.length + 1;
    const r = await apiPost({action:'criarParada', lancamentoId: LANC.ID, numeroLoja: proximoNumero});
    if(r.ok){
      LANC = await apiGet({action:'getLancamento', id: LANC.ID});
      renderAndamento();
    }
  }catch(e){ toast('Falha de conexão', true); }
}

function naoTemProximaLoja(){
  localStorage.setItem(`frota_loja_fim_${LANC.ID}`, '1');
  renderAndamento();
}

function calcularTotalLocal(horaIni, horaFim){
  const [h1,m1] = horaIni.split(':').map(Number);
  const [h2,m2] = horaFim.split(':').map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff < 0) diff += 24*60;
  const h = Math.floor(diff/60), m = diff%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

function ligarAutoSaveRetorno(){
  ['fHoraCD','fDataChegada','fKmChegada'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', autoSalvarRetorno);
  });
}

async function salvarNomeCorrigido(){
  const novoNome = $('#fMotoristaCorrigido').value;
  if(!novoNome) return;
  const btn = $('#btnSalvarNomeCorrigido');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  try{
    const r = await apiPost({action:'atualizarLancamento', id: LANC.ID, campos: { Motorista: novoNome }});
    if(r.ok){
      localStorage.setItem('frota_jornada_nome', novoNome);
      toast('Nome corrigido!');
      LANC = await apiGet({action:'getLancamento', id: LANC.ID});
      renderAndamento();
    }else{
      toast(r.erro || 'Erro ao salvar', true);
      btn.disabled = false;
      btn.textContent = 'Salvar nome';
    }
  }catch(e){
    toast('Falha de conexão', true);
    btn.disabled = false;
    btn.textContent = 'Salvar nome';
  }
}

async function autoSalvarRetorno(){
  const campos = {
    HoraChegadaCD: $('#fHoraCD').value,
    DataChegadaMotorista: $('#fDataChegada').value,
    KmChegada: $('#fKmChegada').value
  };
  const status = document.getElementById('status_retorno');
  if(status) status.textContent = 'Salvando...';
  try{
    const r = await apiPost({action:'atualizarLancamento', id: LANC.ID, campos});
    if(r.ok){
      if(status) status.textContent = 'Salvo ✓';
      // km de chegada preenchido = servidor já fecha a viagem sozinho;
      // busca de novo pra saber o status real e travar a tela na hora, se for o caso
      if(campos.KmChegada){
        LANC = await apiGet({action:'getLancamento', id: LANC.ID});
        renderAndamento();
      }else{
        Object.assign(LANC, campos);
      }
    }else{
      if(status) status.textContent = 'Erro ao salvar!';
      toast(r.erro || 'Erro ao salvar', true);
    }
  }catch(e){
    if(status) status.textContent = 'Falha de conexão — tente de novo';
    toast('Falha de conexão', true);
  }
}

function ligarAutoSaveHoraSaida(){
  const el = document.getElementById('fHoraSaidaVeiculo');
  if(el) el.addEventListener('change', autoSalvarHoraSaida);
}

async function autoSalvarHoraSaida(){
  const campos = { HoraProgramadaSaida: $('#fHoraSaidaVeiculo').value };
  const status = document.getElementById('status_horasaida');
  const el = $('#fHoraSaidaVeiculo');
  if(status) status.textContent = 'Salvando...';
  try{
    const r = await apiPost({action:'atualizarLancamento', id: LANC.ID, campos});
    if(r.ok){
      LANC.HoraProgramadaSaida = campos.HoraProgramadaSaida;
      if(status) status.textContent = 'Salvo ✓';
      if(el) el.style.borderColor = 'var(--line)';
    }else{
      if(status) status.textContent = 'Erro ao salvar!';
      toast(r.erro || 'Erro ao salvar', true);
    }
  }catch(e){
    if(status) status.textContent = 'Falha de conexão — tente de novo';
    toast('Falha de conexão', true);
  }
}

// Verifica se ficou algo essencial faltando (ex.: motorista esqueceu de
// lançar a hora de saída do veículo lá no início) antes de permitir finalizar.
// Retorna a lista de campos faltantes, na ordem em que aparecem na tela.
function camposFaltantesParaFinalizar(){
  const horaSaidaVeiculo = $('#fHoraSaidaVeiculo') ? $('#fHoraSaidaVeiculo').value : LANC.HoraProgramadaSaida;
  const horaChegadaCD = $('#fHoraCD').value;
  const kmChegada = $('#fKmChegada').value;

  const faltando = [];
  if(!horaSaidaVeiculo) faltando.push({ id:'fHoraSaidaVeiculo', label:'Hora de saída do veículo' });
  if(!horaChegadaCD) faltando.push({ id:'fHoraCD', label:'Hora de chegada no CD' });
  if(!kmChegada) faltando.push({ id:'fKmChegada', label:'Km de chegada' });
  return faltando;
}

function sinalizarCampoFaltante(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.focus();
  el.style.borderColor = 'var(--red)';
  const limpar = () => { el.style.borderColor = 'var(--line)'; el.removeEventListener('input', limpar); el.removeEventListener('change', limpar); };
  el.addEventListener('input', limpar);
  el.addEventListener('change', limpar);
}

async function finalizarJornada(){
  const faltando = camposFaltantesParaFinalizar();
  if(faltando.length > 0){
    toast('Antes de finalizar, informe: ' + faltando.map(f=>f.label).join(', '), true);
    sinalizarCampoFaltante(faltando[0].id);
    return;
  }

  // Pega a data do campo ou usa a data de hoje se estiver vazio
  let dataChegada = $('#fDataChegada').value;
  if (!dataChegada) {
    dataChegada = hojeISO();
  }

  const campos = {
    HoraProgramadaSaida: $('#fHoraSaidaVeiculo').value,
    HoraChegadaCD: $('#fHoraCD').value,
    DataChegadaMotorista: dataChegada,
    KmChegada: $('#fKmChegada').value
  };
  try{
    const r = await apiPost({action:'atualizarLancamento', id: LANC.ID, campos});
    if(r.ok){
      toast('Jornada finalizada!');
      LANC = await apiGet({action:'getLancamento', id: LANC.ID});
      renderAndamento();
    }else{
      toast(r.erro || 'Erro ao salvar', true);
    }
  }catch(e){ toast('Falha de conexão', true); }
}

init();
</script>
